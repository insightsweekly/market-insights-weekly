<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Insights Weekly Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        const LOCAL_STORAGE_KEY = 'market_insights_archive_data';
        let newsData = [];
        let activeTags = new Set();
        let activeRegions = new Set();

        const THEME_MAP = {
            "Politics & Policy": ["Geopolitics", "China-US Relations", "Tariff", "NPC", "Policy & Regulations", "Politics", "Political"],
            "Economy & Market": ["Economy", "Tourism", "Consumer Trend", "Workforce", "Golden Week", "RMB/e-CNY"],
            "Sports & Betting": ["Sports & Entertainment", "Racing", "Football", "NBA", "Mega-Event", "National Games", "F1", "Rugby Seven", "World Cup", "LIV Golf", "Basketball Betting", "Gaming"],
            "Technology & Innovation": ["AI", "Fintech", "Technology", "Stablecoins"],
            "Others": ["ARC/FEI", "Betting Tax", "HKJC-related", "HKJC-Related"]
        };

        const REGION_ORDER = ["Global", "Chinese Mainland", "Hong Kong", "Macau", "Industry Updates"];

        const REGION_COLORS = {
            "Global": { label: "text-purple-600 bg-purple-50 border-purple-100", accent: "border-l-purple-500", glow: "after:bg-purple-400/10" },
            "Chinese Mainland": { label: "text-red-600 bg-red-50 border-red-100", accent: "border-l-red-500", glow: "after:bg-red-400/10" },
            "Hong Kong": { label: "text-rose-500 bg-rose-50 border-rose-100", accent: "border-l-rose-400", glow: "after:bg-rose-400/10" },
            "Macau": { label: "text-emerald-600 bg-emerald-50 border-emerald-100", accent: "border-l-emerald-500", glow: "after:bg-emerald-600/10" },
            "Industry Updates": { label: "text-amber-800 bg-amber-50 border-amber-100", accent: "border-l-amber-700", glow: "after:bg-amber-600/10" }
        };

        const DEFAULT_COLOR = { label: "text-gray-600 bg-gray-50 border-gray-100", accent: "border-l-gray-300", glow: "after:bg-gray-400/5" };

        function loadData() {
            const subtitle = document.getElementById('archiveSubtitle');
            try {
                // Fetch data from browser's local storage instead of Firebase
                const storedData = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (storedData) {
                    newsData = JSON.parse(storedData);
                    // Sort by date descending
                    newsData.sort((a, b) => new Date(b.date) - new Date(a.date));
                } else {
                    newsData = [];
                }

                if (subtitle) {
                    subtitle.className = "text-emerald-600 font-medium transition-colors";
                    subtitle.textContent = `Local Mode • ${newsData.length} records saved`;
                }
                
                hideLoader();
                renderFilters();
                renderFeed();
            } catch (error) {
                console.error("Failed to load local data:", error);
                if (subtitle) subtitle.textContent = "Error loading local data.";
                hideLoader();
            }
        }

        function hideLoader() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.classList.add('hidden');
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('loadingOverlay').classList.remove('hidden');
            
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    try {
                        const newRecords = [];
                        results.data.forEach(row => {
                            const dateStr = row.Date || '';
                            let isoDate = dateStr;
                            if (dateStr.includes('/')) {
                                const parts = dateStr.split('/');
                                if (parts.length === 3) isoDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                            }
                            const title = row.Topic || row.Title || row.topic || row.title;
                            const points = row.Points || row.points || row.Content || '';
                            const hashtags = row.Hashtags || row.hashtags || row.Tags || '';
                            const link = row.Link || row.Links || row.link || row.links || '';
                            
                            if (!title) return;
                            
                            // Generate a unique ID based on title and date to prevent exact duplicates
                            const docId = btoa(unescape(encodeURIComponent(title + isoDate))).substring(0, 30).replace(/[/+=]/g, '');
                            
                            newRecords.push({
                                id: docId,
                                date: isoDate,
                                displayDate: dateStr,
                                region: row.Region || 'Global',
                                title: title,
                                links: link.split(',').map(l => l.trim()).filter(l => l),
                                rawPoints: points,
                                hashtags: hashtags.split(',').map(h => h.trim().replace(/^#/, '')).filter(h => h),
                                updatedAt: Date.now()
                            });
                        });

                        // Merge new records with existing ones (avoiding duplicates)
                        const existingIds = new Set(newsData.map(item => item.id));
                        newRecords.forEach(record => {
                            if (!existingIds.has(record.id)) {
                                newsData.push(record);
                            }
                        });

                        // Save updated array back to local storage
                        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(newsData));
                        
                        // Reload view
                        loadData();
                    } catch (err) { 
                        console.error("Sync failed:", err); 
                    } finally { 
                        hideLoader(); 
                        // Reset file input
                        document.getElementById('csvFileInput').value = '';
                    }
                }
            });
        }

        function renderFilters() {
            const newsMatchingRegions = activeRegions.size === 0 ? newsData : newsData.filter(item => activeRegions.has(item.region));
            const tagsInCurrentRegions = new Set(newsMatchingRegions.flatMap(item => item.hashtags));
            const allTags = [...new Set(newsData.flatMap(item => item.hashtags))].filter(t => t).sort();
            
            const uniqueRegions = [...new Set(newsData.map(item => item.region))].filter(r => r);
            const allRegions = uniqueRegions.sort((a, b) => {
                const indexA = REGION_ORDER.indexOf(a);
                const indexB = REGION_ORDER.indexOf(b);
                if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                return indexA !== -1 ? -1 : 1;
            });

            const tagCloud = document.getElementById('tagCloud');
            const regionCloud = document.getElementById('regionCloud');
            tagCloud.innerHTML = ''; regionCloud.innerHTML = '';

            const createBtn = (text, isActive, set, colorClass, isTag = false) => {
                const btn = document.createElement('button');
                const val = text.replace('#', '');
                let isAvailable = !isTag || activeRegions.size === 0 || tagsInCurrentRegions.has(val);
                let baseClass = `px-3 py-1.5 rounded-lg text-xs font-bold border transition-all `;
                let stateClass = isActive ? colorClass : (isAvailable ? 'bg-white text-gray-500 border-gray-200 hover:border-gray-300' : 'bg-gray-50 text-gray-300 border-gray-100 opacity-40 cursor-default');

                btn.className = baseClass + stateClass;
                btn.textContent = text;
                btn.onclick = () => { if(set.has(val)) set.delete(val); else set.add(val); renderFilters(); renderFeed(); };
                return btn;
            };

            allRegions.forEach(r => regionCloud.appendChild(createBtn(r, activeRegions.has(r), activeRegions, 'region-tag-active')));

            const groupedTags = {};
            const processedTags = new Set();
            for (const [theme, keywords] of Object.entries(THEME_MAP)) {
                allTags.forEach(tag => {
                    if (keywords.some(k => k.toLowerCase() === tag.toLowerCase())) {
                        if (!groupedTags[theme]) groupedTags[theme] = [];
                        groupedTags[theme].push(tag); processedTags.add(tag);
                    }
                });
            }
            const uncategorized = allTags.filter(t => !processedTags.has(t));

            const renderGroup = (title, tags) => {
                if (!tags || tags.length === 0) return;
                const container = document.createElement('div');
                container.className = "mb-4 last:mb-0";
                container.innerHTML = `<h4 class="text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-tight">${title}</h4>`;
                const list = document.createElement('div');
                list.className = "flex flex-wrap gap-2";
                tags.sort().forEach(t => list.appendChild(createBtn(`#${t}`, activeTags.has(t), activeTags, 'tag-active', true)));
                container.appendChild(list); tagCloud.appendChild(container);
            };

            ["Politics & Policy", "Economy & Market", "Sports & Betting", "Technology & Innovation", "Others"].forEach(theme => renderGroup(theme, groupedTags[theme]));
            if (uncategorized.length > 0) renderGroup("Miscellaneous", uncategorized);
        }

        function parseBold(text) { return text.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900">$1</strong>'); }

        function renderFullContent(rawText) {
            let text = rawText.replace(/\\n/g, '\n');
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            let finalHtml = '', inTable = false, tableHtml = '';

            lines.forEach(line => {
                if (line.startsWith('||') && line.endsWith('||')) {
                    if (!inTable) { inTable = true; tableHtml = '<div class="overflow-x-auto my-4 border border-gray-200 rounded-lg shadow-sm"><table class="w-full text-xs text-left border-collapse">'; }
                    const innerContent = line.slice(2, -2);
                    const cells = innerContent.split('|').map(c => c.trim());
                    const isDivider = innerContent.includes('---');
                    const isHeader = !isDivider && tableHtml.split('<tr').length === 1;
                    if (!isDivider) {
                        tableHtml += `<tr class="${isHeader ? 'bg-slate-100 font-bold border-b border-gray-300' : 'border-b border-gray-100 last:border-0'}">`;
                        cells.forEach(cell => { tableHtml += `<${isHeader ? 'th' : 'td'} class="p-3 border-r border-gray-100 last:border-0">${parseBold(cell)}</${isHeader ? 'th' : 'td'}>`; });
                        tableHtml += '</tr>';
                    }
                } else {
                    if (inTable) { inTable = false; tableHtml += '</table></div>'; finalHtml += tableHtml; tableHtml = ''; }
                    const bullets = line.split('|').map(b => b.trim()).filter(b => b);
                    bullets.forEach(bullet => {
                        finalHtml += `<div class="flex gap-2 mb-3 last:mb-0"><span class="text-blue-400 mt-2 shrink-0 w-1.5 h-1.5 bg-blue-400 rounded-full"></span><div class="flex-grow text-sm text-gray-600 leading-relaxed">${parseBold(bullet)}</div></div>`;
                    });
                }
            });
            if (inTable) { tableHtml += '</table></div>'; finalHtml += tableHtml; }
            return finalHtml;
        }

        function renderFeed() {
            const queryRaw = document.getElementById('searchInput').value.trim();
            const from = document.getElementById('dateFrom').value, to = document.getElementById('dateTo').value;
            const feed = document.getElementById('newsFeed'), empty = document.getElementById('emptyState');
            let regex = null;
            if (queryRaw) { try { regex = new RegExp(`\\b${queryRaw}\\b`, 'i'); } catch (e) { regex = null; } }

            const filtered = newsData.filter(item => {
                const searchStr = (item.title + " " + item.rawPoints);
                let matchesSearch = !queryRaw || (regex ? regex.test(searchStr) : searchStr.toLowerCase().includes(queryRaw.toLowerCase()));
                const itemTime = new Date(item.date).getTime();
                const matchesFrom = !from || itemTime >= new Date(from).getTime();
                const matchesTo = !to || itemTime <= new Date(to).getTime();
                const matchesTag = activeTags.size === 0 || item.hashtags.some(t => activeTags.has(t));
                const matchesRegion = activeRegions.size === 0 || activeRegions.has(item.region);
                return matchesSearch && matchesFrom && matchesTo && matchesTag && matchesRegion;
            });

            feed.innerHTML = '';
            if (filtered.length === 0) { empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');

            filtered.forEach(item => {
                const div = document.createElement('div');
                const colors = REGION_COLORS[item.region] || DEFAULT_COLOR;
                div.className = `relative overflow-hidden bg-white p-6 rounded-xl border border-gray-100 border-l-4 ${colors.accent} shadow-sm hover:shadow-md transition-all group`;
                const flare = `<div class="absolute -right-20 -top-20 w-64 h-64 rounded-full blur-3xl pointer-events-none transition-opacity opacity-0 group-hover:opacity-100 ${colors.glow.replace('after:', '')}"></div>`;
                div.innerHTML = `${flare}<div class="relative z-10"><div class="flex justify-between items-start mb-3"><span class="text-[10px] font-black uppercase tracking-widest ${colors.label} px-2 py-1 rounded border shadow-sm">${item.region}</span><span class="text-xs text-gray-400 font-mono">${item.displayDate}</span></div><div class="flex flex-col md:flex-row justify-between items-start mb-4 gap-4"><h2 class="text-lg font-bold text-slate-800 leading-tight group-hover:text-black transition-colors">${item.title}</h2><div class="flex flex-wrap gap-1.5 shrink-0">${(item.links || []).map(url => `<a href="${url}" target="_blank" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></a>`).join('')}</div></div><div class="space-y-1 mb-6">${renderFullContent(item.rawPoints)}</div><div class="flex flex-wrap gap-2 pt-4 border-t border-gray-50">${item.hashtags.map(t => `<span class="text-[11px] font-bold text-slate-400 bg-slate-50 px-2 py-0.5 rounded">#${t}</span>`).join('')}</div></div>`;
                feed.appendChild(div);
            });
        }

        window.handleFileUpload = handleFileUpload;
        window.triggerSearch = () => {
            renderFeed();
            setTimeout(() => {
                const feed = document.getElementById('newsFeed');
                window.scrollTo({ top: feed.getBoundingClientRect().top + window.scrollY - 20, behavior: 'smooth' });
            }, 100);
        };

        window.exportToCSV = () => {
            const csv = Papa.unparse(newsData.map(i => ({ Date: i.displayDate, Region: i.region, Topic: i.title, Points: i.rawPoints, Hashtags: i.hashtags.join(', '), Links: i.links.join(', ') })));
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'Market_Insights_Archive.csv'; a.click();
        };

        window.openDeleteModal = () => {
            document.getElementById('passwordModal').classList.remove('hidden');
            setTimeout(() => {
                const content = document.getElementById('passwordModalContent');
                content.classList.remove('scale-95', 'opacity-0'); content.classList.add('scale-100', 'opacity-100');
                document.getElementById('deletePasswordInput').focus();
            }, 10);
        };

        window.closeDeleteModal = () => {
            const content = document.getElementById('passwordModalContent');
            content.classList.add('scale-95', 'opacity-0'); content.classList.remove('scale-100', 'opacity-100');
            setTimeout(() => { document.getElementById('passwordModal').classList.add('hidden'); document.getElementById('deletePasswordInput').value = ''; document.getElementById('passwordError').classList.add('hidden'); }, 200);
        };

        window.confirmDeleteAll = () => {
            if (document.getElementById('deletePasswordInput').value === "smmi") {
                closeDeleteModal(); 
                document.getElementById('loadingOverlay').classList.remove('hidden');
                
                // Clear local storage and array
                localStorage.removeItem(LOCAL_STORAGE_KEY);
                newsData = [];
                
                setTimeout(() => {
                    loadData(); // Re-render
                    document.getElementById('loadingOverlay').classList.add('hidden');
                }, 500); // Small delay for visual feedback
            } else { 
                document.getElementById('passwordError').classList.remove('hidden'); 
            }
        };

        window.onload = () => {
            // Load local data instead of Firebase Auth
            loadData();

            document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') triggerSearch(); });
            document.getElementById('deletePasswordInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') confirmDeleteAll(); });
            ['dateFrom', 'dateTo'].forEach(id => document.getElementById(id).addEventListener('change', renderFeed));
            
            window.addEventListener('click', (e) => {
                const menu = document.getElementById('adminMenu'), btn = document.getElementById('adminToggleBtn');
                if (menu && !menu.contains(e.target) && !btn.contains(e.target)) menu.classList.add('hidden');
            });
        };

        window.toggleAdminMenu = () => document.getElementById('adminMenu').classList.toggle('hidden');
        window.forceView = hideLoader;
    </script>
    <style>
        .tag-active { background-color: #2563eb !important; color: white !important; border-color: #2563eb !important; }
        .region-tag-active { background-color: #059669 !important; color: white !important; border-color: #059669 !important; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #adminMenu { animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900 pb-20 relative">
    <div id="loadingOverlay" class="fixed inset-0 bg-white/95 backdrop-blur-md z-50 flex flex-col items-center justify-center text-center px-6">
        <div class="loader mb-6"></div>
        <p class="text-slate-800 font-bold text-lg mb-1">Market Insights Weekly Archive</p>
        <p class="text-slate-400 text-sm mb-6 max-w-xs">Loading local dataset...</p>
        <button onclick="forceView()" class="bg-white border border-gray-200 text-gray-600 px-6 py-2 rounded-full text-xs font-bold hover:bg-gray-50 transition-all shadow-sm">
            Proceed to Dashboard
        </button>
    </div>

    <div class="fixed bottom-8 right-8 z-40 flex items-center gap-3">
        <div class="relative">
            <div id="adminMenu" class="hidden absolute bottom-16 right-0 w-48 bg-white rounded-xl shadow-2xl border border-gray-100 overflow-hidden mb-2">
                <label class="flex items-center gap-2 w-full px-4 py-3 text-sm text-gray-600 hover:bg-gray-50 cursor-pointer border-b border-gray-50">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Sync CSV
                    <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleFileUpload(event)">
                </label>
                <button onclick="exportToCSV()" class="flex items-center gap-2 w-full px-4 py-3 text-sm text-gray-500 hover:bg-gray-50 border-b border-gray-50 bg-gray-50/50">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Export Archive
                </button>
                <button onclick="openDeleteModal()" class="flex items-center gap-2 w-full px-4 py-3 text-sm text-gray-400 hover:bg-gray-50 opacity-60">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    Delete Records
                </button>
            </div>
            <button id="adminToggleBtn" onclick="toggleAdminMenu()" class="bg-gray-200 text-gray-500 px-4 py-2 rounded-full text-xs font-bold shadow-sm hover:bg-gray-300 opacity-60 hover:opacity-100 flex items-center gap-2 border border-gray-300">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Admin
            </button>
        </div>
        <a href="mailto:bedco.cn.chan@hkjc.org.hk" target="_blank" rel="noopener noreferrer" class="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-110 active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1-2-2h14a2 2 0 0 1 2 2z"></path><path d="M8 9h8"></path><path d="M8 13h6"></path></svg>
        </a>
    </div>

    <div id="passwordModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm transform transition-all scale-95 opacity-0" id="passwordModalContent">
            <h3 class="text-lg font-bold text-slate-800 mb-2">Delete Records</h3>
            <input type="password" id="deletePasswordInput" placeholder="Enter password" class="w-full px-4 py-2 border border-gray-200 rounded-lg mb-2 focus:ring-2 focus:ring-red-500 outline-none">
            <p id="passwordError" class="text-red-500 text-xs font-bold hidden mb-4">Incorrect password.</p>
            <div class="flex justify-end gap-2 mt-4">
                <button onclick="closeDeleteModal()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg font-bold">Cancel</button>
                <button onclick="confirmDeleteAll()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold">Delete All</button>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <header class="mb-4 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Market Insights Weekly Archive</h1>
                <p class="text-gray-400 text-sm" id="archiveSubtitle">Loading Local Data...</p>
            </div>
        </header>

        <div class="bg-white p-5 rounded-xl shadow-sm mb-4 border border-gray-100 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                <div class="md:col-span-6">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Keyword</label>
                    <div class="flex gap-2">
                        <input type="text" id="searchInput" placeholder="Search..." class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        <button onclick="triggerSearch()" class="bg-slate-800 hover:bg-black text-white px-6 py-2.5 rounded-lg font-bold transition-all">Search</button>
                    </div>
                </div>
                <div class="md:col-span-3">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">From</label>
                    <input type="date" id="dateFrom" class="w-full p-2.5 border border-gray-200 rounded-lg outline-none">
                </div>
                <div class="md:col-span-3">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">To</label>
                    <input type="date" id="dateTo" class="w-full p-2.5 border border-gray-200 rounded-lg outline-none">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 pt-4 border-t border-gray-50">
                <div class="md:col-span-4 md:border-r border-gray-50 pr-4">
                    <h3 class="text-xs font-bold text-gray-500 uppercase mb-4">Regions</h3>
                    <div id="regionCloud" class="flex flex-wrap gap-2"></div>
                </div>
                <div class="md:col-span-8 pl-0 md:pl-4">
                    <h3 class="text-xs font-bold text-gray-500 uppercase mb-4">Thematic Topics</h3>
                    <div id="tagCloud" class="space-y-4"></div>
                </div>
            </div>
        </div>

        <div id="newsFeed" class="grid gap-6 scroll-mt-6"></div>
        <div id="emptyState" class="hidden text-center py-20 text-gray-400">No entries match your criteria.</div>
    </div>
</body>
</html>
