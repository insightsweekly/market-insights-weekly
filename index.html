<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Insights Archive (GitHub)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        const DATA_FILE_URL = 'data.csv'; // This must match the file name in your GitHub repo
        const LOCAL_STORAGE_KEY = 'market_insights_local_override';
        let newsData = [];
        let activeTags = new Set();
        let activeRegions = new Set();

        const THEME_MAP = {
            "TOP Search": ["Racing", "Football", "Basketball Betting", "Sports & Entertainment", "Mega-Event", "Gaming"],
            "Economy & Market": ["Consumer Trend", "Economy", "Golden Week", "RMB/e-CNY", "Tourism"],
            "Politics & Policy": ["China-US Relations", "Geopolitics", "NPC", "Policy & Regulations", "Politics", "Tariff"],
            "Other Sports & Entertainment": ["F1", "LIV Golf", "NBA", "National Games", "Rugby Seven", "World Cup"],
            "Technology & Innovation": ["AI", "Fintech", "Stablecoins", "Technology"],
            "Others": ["ARC/FEI", "Betting Tax", "HKJC-related", "Workforce"]
        };

        const REGION_ORDER = ["Global", "Chinese Mainland", "Hong Kong", "Macau"];

        const REGION_COLORS = {
            "Global": { label: "text-purple-600 bg-purple-50 border-purple-100", accent: "border-l-purple-500", glow: "after:bg-purple-400/10" },
            "Chinese Mainland": { label: "text-red-600 bg-red-50 border-red-100", accent: "border-l-red-500", glow: "after:bg-red-400/10" },
            "Hong Kong": { label: "text-rose-500 bg-rose-50 border-rose-100", accent: "border-l-rose-400", glow: "after:bg-rose-400/10" },
            "Macau": { label: "text-emerald-600 bg-emerald-50 border-emerald-100", accent: "border-l-emerald-500", glow: "after:bg-emerald-600/10" }
        };

        const DEFAULT_COLOR = { label: "text-gray-600 bg-gray-50 border-gray-100", accent: "border-l-gray-300", glow: "after:bg-gray-400/5" };

        async function loadData() {
            const subtitle = document.getElementById('archiveSubtitle');
            try {
                // 1. Try to fetch the CSV file hosted on GitHub
                const response = await fetch(DATA_FILE_URL);
                if (response.ok) {
                    const csvText = await response.text();
                    parseAndSetData(csvText, "GitHub Cloud");
                } else {
                    throw new Error("CSV file not found in repository");
                }
            } catch (error) {
                console.warn("GitHub CSV fetch failed, checking local storage...", error);
                const storedData = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (storedData) {
                    newsData = JSON.parse(storedData);
                    processAndRender("Local Cache");
                } else {
                    if (subtitle) subtitle.textContent = "No data found. Please upload a 'data.csv' to your GitHub repo.";
                    hideLoader();
                }
            }
        }

        function parseAndSetData(csvString, sourceLabel) {
            Papa.parse(csvString, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    newsData = results.data.map(row => {
                        const dateStr = row.Date || '';
                        let isoDate = dateStr;
                        if (dateStr.includes('/')) {
                            const parts = dateStr.split('/');
                            if (parts.length === 3) isoDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        }
                        const title = row.Topic || row.Title || row.topic || row.title;
                        return {
                            id: btoa(unescape(encodeURIComponent(title + isoDate))).substring(0, 30),
                            date: isoDate,
                            displayDate: dateStr,
                            region: row.Region || 'Global',
                            title: title,
                            links: (row.Link || row.Links || '').split(',').map(l => l.trim()).filter(l => l),
                            rawPoints: row.Points || row.Content || '',
                            hashtags: (row.Hashtags || row.Tags || '').split(',').map(h => h.trim().replace(/^#/, '')).filter(h => h)
                        };
                    });
                    
                    // Sort by date descending
                    newsData.sort((a, b) => new Date(b.date) - new Date(a.date));
                    processAndRender(sourceLabel);
                }
            });
        }

        function processAndRender(sourceLabel) {
            const subtitle = document.getElementById('archiveSubtitle');
            if (subtitle) {
                subtitle.className = "text-emerald-600 font-medium";
                subtitle.textContent = `${sourceLabel} • ${newsData.length} records`;
            }
            hideLoader();
            renderFilters();
            renderFeed();
        }

        function hideLoader() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        function renderFilters() {
            const newsMatchingRegions = activeRegions.size === 0 ? newsData : newsData.filter(item => activeRegions.has(item.region));
            const tagsInCurrentRegions = new Set(newsMatchingRegions.flatMap(item => item.hashtags));
            const allTags = [...new Set(newsData.flatMap(item => item.hashtags))].filter(t => t).sort();
            
            const uniqueRegions = [...new Set(newsData.map(item => item.region))].filter(r => r);
            const allRegions = uniqueRegions.sort((a, b) => {
                const indexA = REGION_ORDER.indexOf(a);
                const indexB = REGION_ORDER.indexOf(b);
                return (indexA !== -1 ? indexA : 99) - (indexB !== -1 ? indexB : 99);
            });

            const tagCloud = document.getElementById('tagCloud');
            const regionCloud = document.getElementById('regionCloud');
            tagCloud.innerHTML = ''; regionCloud.innerHTML = '';

            const createBtn = (text, isActive, set, colorClass, isTag = false) => {
                const btn = document.createElement('button');
                const val = text.replace('#', '');
                let isAvailable = !isTag || activeRegions.size === 0 || tagsInCurrentRegions.has(val);
                let baseClass = `px-3 py-1.5 rounded-lg text-xs font-bold border transition-all `;
                let stateClass = isActive ? colorClass : (isAvailable ? 'bg-white text-gray-500 border-gray-200 hover:border-gray-300' : 'bg-gray-50 text-gray-300 border-gray-100 opacity-40 cursor-default');

                btn.className = baseClass + stateClass;
                btn.textContent = text;
                btn.onclick = () => { if(set.has(val)) set.delete(val); else set.add(val); renderFilters(); renderFeed(); };
                return btn;
            };

            allRegions.forEach(r => regionCloud.appendChild(createBtn(r, activeRegions.has(r), activeRegions, 'region-tag-active')));

            const groupedTags = {};
            const processedTags = new Set();
            for (const [theme, keywords] of Object.entries(THEME_MAP)) {
                allTags.forEach(tag => {
                    if (keywords.some(k => k.toLowerCase() === tag.toLowerCase())) {
                        if (!groupedTags[theme]) groupedTags[theme] = [];
                        groupedTags[theme].push(tag); processedTags.add(tag);
                    }
                });
            }
            const uncategorized = allTags.filter(t => !processedTags.has(t));

            const renderGroup = (title, tags) => {
                if (!tags || tags.length === 0) return;
                const container = document.createElement('div');
                container.className = "mb-4 last:mb-0";
                container.innerHTML = `<h4 class="text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-tight">${title}</h4>`;
                const list = document.createElement('div');
                list.className = "flex flex-wrap gap-2";
                tags.sort().forEach(t => list.appendChild(createBtn(`#${t}`, activeTags.has(t), activeTags, 'tag-active', true)));
                container.appendChild(list); tagCloud.appendChild(container);
            };

            ["TOP Search", "Economy & Market", "Politics & Policy", "Other Sports & Entertainment", "Technology & Innovation", "Others"].forEach(theme => renderGroup(theme, groupedTags[theme]));
            if (uncategorized.length > 0) renderGroup("Miscellaneous", uncategorized);
        }

        function parseBold(text) { return text.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900">$1</strong>'); }

        function renderFullContent(rawText) {
            let text = (rawText || '').replace(/\\n/g, '\n');
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            let finalHtml = '', inTable = false, tableHtml = '';

            lines.forEach(line => {
                if (line.startsWith('||') && line.endsWith('||')) {
                    if (!inTable) { inTable = true; tableHtml = '<div class="overflow-x-auto my-4 border border-gray-200 rounded-lg shadow-sm"><table class="w-full text-xs text-left border-collapse">'; }
                    const innerContent = line.slice(2, -2);
                    const cells = innerContent.split('|').map(c => c.trim());
                    const isDivider = innerContent.includes('---');
                    const isHeader = !isDivider && tableHtml.split('<tr').length === 1;
                    if (!isDivider) {
                        tableHtml += `<tr class="${isHeader ? 'bg-slate-100 font-bold border-b border-gray-300' : 'border-b border-gray-100 last:border-0'}">`;
                        cells.forEach(cell => { tableHtml += `<${isHeader ? 'th' : 'td'} class="p-3 border-r border-gray-100 last:border-0">${parseBold(cell)}</${isHeader ? 'th' : 'td'}>`; });
                        tableHtml += '</tr>';
                    }
                } else {
                    if (inTable) { inTable = false; tableHtml += '</table></div>'; finalHtml += tableHtml; tableHtml = ''; }
                    const bullets = line.split('|').map(b => b.trim()).filter(b => b);
                    bullets.forEach(bullet => {
                        finalHtml += `<div class="flex gap-2 mb-3 last:mb-0"><span class="text-blue-400 mt-2 shrink-0 w-1.5 h-1.5 bg-blue-400 rounded-full"></span><div class="flex-grow text-sm text-gray-600 leading-relaxed">${parseBold(bullet)}</div></div>`;
                    });
                }
            });
            if (inTable) { tableHtml += '</table></div>'; finalHtml += tableHtml; }
            return finalHtml;
        }

        function renderFeed() {
            const queryRaw = document.getElementById('searchInput').value.trim();
            const from = document.getElementById('dateFrom').value, to = document.getElementById('dateTo').value;
            const feed = document.getElementById('newsFeed'), empty = document.getElementById('emptyState');
            let regex = null;
            if (queryRaw) { try { regex = new RegExp(`\\b${queryRaw}\\b`, 'i'); } catch (e) { regex = null; } }

            const filtered = newsData.filter(item => {
                const searchStr = (item.title + " " + item.rawPoints);
                let matchesSearch = !queryRaw || (regex ? regex.test(searchStr) : searchStr.toLowerCase().includes(queryRaw.toLowerCase()));
                const itemTime = new Date(item.date).getTime();
                const matchesFrom = !from || itemTime >= new Date(from).getTime();
                const matchesTo = !to || itemTime <= new Date(to).getTime();
                const matchesTag = activeTags.size === 0 || item.hashtags.some(t => activeTags.has(t));
                const matchesRegion = activeRegions.size === 0 || activeRegions.has(item.region);
                return matchesSearch && matchesFrom && matchesTo && matchesTag && matchesRegion;
            });

            feed.innerHTML = '';
            if (filtered.length === 0) { empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');

            filtered.forEach(item => {
                const div = document.createElement('div');
                const colors = REGION_COLORS[item.region] || DEFAULT_COLOR;
                div.className = `relative overflow-hidden bg-white p-6 rounded-xl border border-gray-100 border-l-4 ${colors.accent} shadow-sm hover:shadow-md transition-all group mb-6`;
                div.innerHTML = `<div class="relative z-10"><div class="flex justify-between items-start mb-3"><span class="text-[10px] font-black uppercase tracking-widest ${colors.label} px-2 py-1 rounded border shadow-sm">${item.region}</span><span class="text-xs text-gray-400 font-mono">${item.displayDate}</span></div><div class="flex flex-col md:flex-row justify-between items-start mb-4 gap-4"><h2 class="text-lg font-bold text-slate-800 leading-tight group-hover:text-black transition-colors">${item.title}</h2><div class="flex flex-wrap gap-1.5 shrink-0">${(item.links || []).map(url => `<a href="${url}" target="_blank" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></a>`).join('')}</div></div><div class="space-y-1 mb-6">${renderFullContent(item.rawPoints)}</div><div class="flex flex-wrap gap-2 pt-4 border-t border-gray-50">${item.hashtags.map(t => `<span class="text-[11px] font-bold text-slate-400 bg-slate-50 px-2 py-0.5 rounded">#${t}</span>`).join('')}</div></div>`;
                feed.appendChild(div);
            });
        }

        window.triggerSearch = () => {
            renderFeed();
            setTimeout(() => {
                const feed = document.getElementById('newsFeed');
                window.scrollTo({ top: feed.getBoundingClientRect().top + window.scrollY - 20, behavior: 'smooth' });
            }, 100);
        };

        window.onload = () => {
            loadData();
            document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') triggerSearch(); });
            ['dateFrom', 'dateTo'].forEach(id => document.getElementById(id).addEventListener('change', renderFeed));
        };
    </script>
    <style>
        .tag-active { background-color: #2563eb !important; color: white !important; border-color: #2563eb !important; }
        .region-tag-active { background-color: #059669 !important; color: white !important; border-color: #059669 !important; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900 pb-20">
    <div id="loadingOverlay" class="fixed inset-0 bg-white/95 backdrop-blur-md z-50 flex flex-col items-center justify-center text-center px-6">
        <div class="loader mb-6"></div>
        <p class="text-slate-800 font-bold text-lg mb-1">Market Insights Weekly Archive</p>
        <p class="text-slate-400 text-sm mb-6 max-w-xs">Connecting to repository data...</p>
    </div>

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <header class="mb-4 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Market Insights Weekly Archive</h1>
                <p class="text-gray-400 text-sm" id="archiveSubtitle">Loading...</p>
            </div>
            <div class="flex items-center gap-4">
                <p class="text-[10px] text-gray-400 bg-gray-100 px-3 py-1 rounded-full border">GitHub Mode</p>
            </div>
        </header>

        <div class="bg-white p-5 rounded-xl shadow-sm mb-4 border border-gray-100 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                <div class="md:col-span-6">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Keyword</label>
                    <div class="flex gap-2">
                        <input type="text" id="searchInput" placeholder="Search..." class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        <button onclick="triggerSearch()" class="bg-slate-800 hover:bg-black text-white px-6 py-2.5 rounded-lg font-bold transition-all">Search</button>
                    </div>
                </div>
                <div class="md:col-span-3">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">From</label>
                    <input type="date" id="dateFrom" class="w-full p-2.5 border border-gray-200 rounded-lg outline-none">
                </div>
                <div class="md:col-span-3">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">To</label>
                    <input type="date" id="dateTo" class="w-full p-2.5 border border-gray-200 rounded-lg outline-none">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 pt-4 border-t border-gray-50">
                <div class="md:col-span-4 md:border-r border-gray-50 pr-4">
                    <h3 class="text-xs font-bold text-gray-500 uppercase mb-4">Regions</h3>
                    <div id="regionCloud" class="flex flex-wrap gap-2"></div>
                </div>
                <div class="md:col-span-8 pl-0 md:pl-4">
                    <h3 class="text-xs font-bold text-gray-500 uppercase mb-4">Thematic Topics</h3>
                    <div id="tagCloud" class="space-y-4"></div>
                </div>
            </div>
        </div>

        <div id="newsFeed"></div>
        <div id="emptyState" class="hidden text-center py-20 text-gray-400">No entries match your criteria.</div>
    </div>
    
    <!-- ==================== FLOATING SUPPORT BUTTON ==================== -->
    <button onclick="openSupportEmail()" 
        class="fixed bottom-6 right-6 w-14 h-14 bg-[#1e3a8a] hover:bg-[#1e40af] rounded-2xl shadow-xl flex items-center justify-center transition-all hover:scale-110 active:scale-95 z-50 overflow-hidden border border-white/30">
    
    <img src="icon.png" 
         alt="Support" 
         class="w-10 h-10 object-contain">
    </button>
    
    <script>
    function openSupportEmail() {
        const email = "bedco.cn.chan@hkjc.org.hk";
        const subject = "Market Insights Weekly Support";
        window.open(`mailto:${email}?subject=${encodeURIComponent(subject)}`, '_blank');
    
    function initVisitorCounter() {
        const countEl = document.getElementById('visitorCount');
        let count = parseInt(localStorage.getItem('marketInsightsVisitors') || '0');
        
        // Increment on each page load
        count++;
        localStorage.setItem('marketInsightsVisitors', count);
        
        countEl.textContent = count.toLocaleString();
    }

    // Initialize when page loads
    window.addEventListener('load', () => {
        initVisitorCounter();
    });
    </script>
</body>
</html>
